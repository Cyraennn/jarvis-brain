# JARVIS model router ayarlari (router/).
# Kapatmak icin: .env -> JARVIS_ROUTER_ENABLED=false (ya da ROUTER_ENABLED=false)
#
# Karar zinciri: KURALLAR (~0 ms) -> YEREL SINIFLANDIRICI (~15-30 ms) -> LLM (guven dusukse).
# Agent modelleri bu zincirin SIRASIYLA dener; en son yedek her zaman Gemini zinciridir.

thresholds:
  task_confidence: 0.75        # gorev tipi guveni bunun altindaysa LLM'e sorulur
  difficulty_confidence: 0.60  # zorluk dogasi geregi bulanik; hatasi yalnizca zinciri etkiler
  agent_confidence: 0.75       # ajan secimi guveni bunun altindaysa Conductor LLM'e sorulur
  # guven = sigmoid((en_iyi - ikinci) / margin_temperature). e5 benzerlikleri sikisiktir;
  # 0.008 ile 0.75 esigi ~0.009 benzerlik farkina denk gelir (2026-10-28 kalibrasyonu:
  # yanlis kararlarda fark <= 0.006, dogrularin cogunda >= 0.014).
  margin_temperature: 0.008

llm_fallback:
  timeout_s: 6
  # en hizli once; JSON cikti istenir
  models: [gemini-flash-lite-latest, gemini-3.5-flash-lite]

long_context_chars: 120000   # baglam+gorev bunu asarsa long_context zinciri

# id: saglayici kimligi | provider: gemini | openrouter | claude | ollama
# speed: fast | medium | slow   cost: free | paid
# routable: false -> yalnizca erisilebilirlik raporunda (ajan zincirine girmez)
models:
  - {id: gemini-flash-lite-latest,  provider: gemini, speed: fast,   cost: free, capabilities: [text, tool_use, turkish, long_context]}
  - {id: gemini-3.5-flash-lite,     provider: gemini, speed: fast,   cost: free, capabilities: [text, tool_use, turkish, long_context]}
  - {id: gemini-3.1-flash-lite,     provider: gemini, speed: fast,   cost: free, capabilities: [text, tool_use, turkish, long_context]}
  - {id: gemini-3.5-flash,          provider: gemini, speed: medium, cost: free, capabilities: [text, code, vision, tool_use, turkish, long_context]}
  - {id: gemini-3.6-flash,          provider: gemini, speed: medium, cost: free, capabilities: [text, code, vision, tool_use, turkish, long_context]}
  - {id: nvidia/nemotron-3.5-super-vl:free,       provider: openrouter, speed: medium, cost: free, capabilities: [text, vision, tool_use, turkish, long_context]}
  - {id: poolside/laguna-s-2.1:free,              provider: openrouter, speed: medium, cost: free, capabilities: [text, code, tool_use, turkish]}
  - {id: nvidia/nemotron-3-ultra-550b-a55b:free,  provider: openrouter, speed: slow,   cost: free, capabilities: [text, code, tool_use, turkish, long_context]}
  - {id: dots-studio/dots-3-note-preview:free,    provider: openrouter, speed: slow,   cost: free, capabilities: [text, tool_use, turkish, long_context]}
  - {id: cohere/north-mini-code:free,             provider: openrouter, speed: medium, cost: free, capabilities: [text, code, tool_use, turkish]}
  - {id: claude-opus-5-5,           provider: claude, speed: slow,   cost: paid, capabilities: [text, code, vision, tool_use, turkish, long_context]}
  - {id: "qwen2.5:7b",              provider: ollama, speed: medium, cost: free, capabilities: [text, tool_use, turkish], routable: false}
  - {id: "qwen2.5:1.5b",            provider: ollama, speed: fast,   cost: free, capabilities: [text, turkish], routable: false}

# Tahmini maliyet (Decision Pipeline panosu): $ / 1M token. Listede olmayan model = 0 (ucretsiz).
# Kaynak: Anthropic fiyat tablosu (2026-10). Token sayisi bilinmedigi icin TAHMINDIR:
# girdi ~ (istek karakteri / 4) + sabit_girdi, cikti ~ sabit_cikti; arac adimi basina tekrar.
pricing:
  claude-opus-5-5: {input: 4.00, output: 20.00}
cost_estimate:
  base_input_tokens: 1500     # sistem istemi + arac tanimlari
  output_tokens: 600          # model cagrisi basina ortalama cevap

# Adlandirilmis yedek zincirleri (soldan saga denenir)
chains:
  hizli:       [gemini-flash-lite-latest, gemini-3.5-flash-lite, nvidia/nemotron-3.5-super-vl:free]
  dengeli:     [gemini-3.5-flash, nvidia/nemotron-3.5-super-vl:free, gemini-flash-lite-latest]
  guclu:       [nvidia/nemotron-3-ultra-550b-a55b:free, gemini-3.6-flash, gemini-3.5-flash, poolside/laguna-s-2.1:free]
  kod:         [poolside/laguna-s-2.1:free, cohere/north-mini-code:free, gemini-3.5-flash]
  kod_zor:     [poolside/laguna-s-2.1:free, nvidia/nemotron-3-ultra-550b-a55b:free, gemini-3.6-flash]
  arastirma:   [nvidia/nemotron-3-ultra-550b-a55b:free, gemini-3.5-flash, dots-studio/dots-3-note-preview:free]
  gorsel:      [gemini-3.5-flash, nvidia/nemotron-3.5-super-vl:free, gemini-3.6-flash]
  uzun_baglam: [gemini-3.5-flash, nvidia/nemotron-3.5-super-vl:free, gemini-3.6-flash]
  qa:          [claude-opus-5-5, nvidia/nemotron-3-ultra-550b-a55b:free, gemini-3.6-flash]

# gorev_tipi -> zorluk -> zincir adi
routes:
  sohbet:        {basit: hizli,    orta: hizli,     zor: dengeli}
  kod:           {basit: kod,      orta: kod,       zor: kod_zor}
  arastirma:     {basit: dengeli,  orta: arastirma, zor: arastirma}
  yazi:          {basit: hizli,    orta: dengeli,   zor: guclu}
  planlama:      {basit: hizli,    orta: dengeli,   zor: guclu}
  gorsel:        {basit: gorsel,   orta: gorsel,    zor: gorsel}
  sistem_komutu: {basit: hizli,    orta: hizli,     zor: dengeli}
  okul:          {basit: hizli,    orta: dengeli,   zor: guclu}
  iletisim:      {basit: hizli,    orta: dengeli,   zor: guclu}
  qa:            {basit: qa,       orta: qa,        zor: qa}
default_chain: hizli

# Ajan secildiyse gorev tipi AJANDAN gelir (ajan secimi gorev tahmininden daha isabetli;
# ayrica kararsiz gorev tipi icin LLM'e sormaya gerek kalmaz). Once agent_task_types,
# yoksa ajanin departmani.
department_task_types:
  okul: okul
  iletisim: iletisim
  sistem: sistem_komutu
  telefon: sistem_komutu
  bilgi: arastirma
  gunluk: planlama
  gelistirme: kod
  yonetim: planlama
agent_task_types:
  mesaj_yazari: yazi
  yanit_taslakcisi: yazi
  belge_ozetleyici: yazi
  kod_denetcisi: kod
  markdown_denetcisi: kod
  bagimlilik_gozcusu: kod
  test_kocu: kod
  bilgisayar_op: kod
  hava_durumu: sohbet
  bilgi_bankasi: sohbet
  not_katibi: sohbet
  muzik_dj: sistem_komutu
  ulasim: sistem_komutu
# Siniflandirici bu tiplerden EMINSE ajan eslemesi onu ezmez (yetenek gerektirir: vision).
keep_classifier_task_types: [gorsel]

# Ajanin agents.json'daki kendi modeli "ipucu"dur: bu zorluklarda zincirin basina,
# digerlerinde sonuna eklenir.
hint_first_for: [orta, zor]

# Kullanici adini acikca soylerse ("claude ile yap") bu model secilir.
aliases:
  claude: claude-opus-5-5
  opus: claude-opus-5-5
  gemini: gemini-3.5-flash
  nemotron: nvidia/nemotron-3-ultra-550b-a55b:free
  laguna: poolside/laguna-s-2.1:free
  poolside: poolside/laguna-s-2.1:free

policy:
  # Ucretli (cost: paid) model YALNIZCA su durumlarda secilebilir:
  #   - ajanin kendi ipucu ucretliyse (kodcu, bilgisayar_op)
  #   - gorev tipi bu listedeyse
  #   - kullanici modeli acikca adiyla istediyse (explicit_ok)
  paid_task_types: [qa]
  paid_explicit_ok: true

# Veronica QA: "zor" gorevlerde ajan sonucu kullaniciya gitmeden kontrol edilir.
qa:
  enabled: true
  min_difficulty: zor
  max_retries: 1          # onaylanmazsa ajan geri bildirimle en fazla bu kadar yeniden calisir
  max_result_chars: 6000
  timeout_s: 90
